worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

rtmp {
    server {
        listen 1935;
        include /tmp/nginx-generated/rtmp.conf;
    }
}

http {
    access_log off;
    server_tokens off;

    server {
        listen 127.0.0.1:8081;
        server_name localhost;

        location = /stat {
            rtmp_stat all;
        }

        location / {
            return 404;
        }
    }
}
